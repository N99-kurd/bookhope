<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHope - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden-section { display: none; }
        .hidden-section.active { display: block; }
    </style>
</head>
<body>

<!-- ===== ADMIN LOGIN PAGE ===== -->
<div id="adminLoginPage" class="hidden-section active">
    <div class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-blue-600">Admin Dashboard</h2>
                <p class="text-gray-600 mt-2">Sign in to manage books</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="adminPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="Enter admin password">
                </div>

                <button onclick="loginAdmin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium">Sign In</button>

                <a href="charity.html" class="block w-full text-center bg-gray-200 hover:bg-gray-300 text-gray-700 py-2 rounded-lg font-medium">Back to Home</a>
            </div>

            
        </div>
    </div>
</div>

<!-- ===== ADMIN DASHBOARD PAGE ===== -->
<div id="adminDashboard" class="hidden-section">
    <div class="min-h-screen bg-gray-50">
        <header class="bg-white shadow">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-blue-600">Admin Dashboard</h1>
                <a href="charity.html" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded">Logout</a>
            </div>
        </header>

        <main class="container mx-auto px-4 py-8">
            <div class="flex gap-4 mb-8 border-b">
                <button onclick="switchTab('addBook')" id="tabAddBook" class="px-4 py-2 border-b-2 border-blue-600 text-blue-600 font-medium">Add Book</button>
                <button onclick="switchTab('manageBooks')" id="tabManageBooks" class="px-4 py-2 border-b-2 border-transparent text-gray-600 font-medium hover:text-blue-600">Manage Books</button>
                <button onclick="switchTab('requests')" id="tabRequests" class="px-4 py-2 border-b-2 border-transparent text-gray-600 font-medium hover:text-blue-600">Requests</button>
            </div>

            <!-- Add Book Tab -->
            <div id="addBookTab" class="tab-content">
                <div class="bg-white rounded-lg shadow p-6 max-w-2xl">
                    <h2 class="text-2xl font-bold mb-6">Add New Book</h2>

                    <div class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Title (English)</label>
                                <input type="text" id="titleEN" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Book title">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Title (Arabic)</label>
                                <input type="text" id="titleAR" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="عنوان الكتاب">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Title (Kurdish)</label>
                                <input type="text" id="titleKU" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="ناونی کتێب">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Author (English)</label>
                                <input type="text" id="authorEN" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Author name">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Author (Arabic)</label>
                                <input type="text" id="authorAR" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="اسم المؤلف">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Author (Kurdish)</label>
                                <input type="text" id="authorKU" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="ناوی نووسەر">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Book Language Category</label>
                            <select id="bookCategory" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                                <option value="kurdish">Kurdish</option>
                                <option value="arabic">Arabic</option>
                                <option value="turkish">Turkish</option>
                                <option value="english">English</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Book Genre</label>
                            <select id="bookGenre" onchange="toggleCustomGenre()" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                                <option value="Medical">Medical</option>
                                <option value="History">History</option>
                                <option value="Religion">Religion</option>
                                <option value="Novels/Fiction">Novels/Fiction</option>
                                <option value="Children's Books">Children's Books</option>
                                <option value="Self-Help">Self-Help</option>
                                <option value="other">Other (type below)</option>
                            </select>
                            <div id="customGenreFields" class="hidden mt-2 space-y-2">
                                <input type="text" id="customGenreEN" placeholder="Genre name (English)" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                                <input type="text" id="customGenreAR" placeholder="Genre name (Arabic)" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                                <input type="text" id="customGenreKU" placeholder="Genre name (Kurdish)" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Badge Label</label>
                            <select id="bookBadge" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                                <option value="none">None</option>
                                <option value="New">New</option>
                                <option value="Classic">Classic</option>
                                <option value="Popular">Popular</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Price (IQD)</label>
                            <input type="number" id="bookPrice" step="250" min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="e.g. 15000">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Book Cover Image</label>
                            <input type="file" id="imageFile" accept="image/*" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            <img id="imagePreview" class="hidden mt-2 h-32 rounded-lg object-contain bg-gray-100">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Description (English)</label>
                                <textarea id="descEN" class="w-full px-4 py-2 border border-gray-300 rounded-lg" rows="3" placeholder="Book description"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Description (Arabic)</label>
                                <textarea id="descAR" class="w-full px-4 py-2 border border-gray-300 rounded-lg" rows="3" placeholder="وصف الكتاب"></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Description (Kurdish)</label>
                                <textarea id="descKU" class="w-full px-4 py-2 border border-gray-300 rounded-lg" rows="3" placeholder="وەسفی کتێب"></textarea>
                            </div>
                        </div>

                        <div class="flex gap-4">
                            <button id="saveBookBtn" onclick="addBook()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium">Save Book</button>
                            <button onclick="clearForm()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-6 py-2 rounded-lg font-medium">Clear</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Manage Books Tab -->
            <div id="manageBooksTab" class="tab-content hidden">
                <div class="space-y-4">
                    <h2 class="text-2xl font-bold mb-6">Manage Books</h2>
                    <div id="booksList" class="space-y-4"></div>
                </div>
            </div>

            <!-- Requests Tab -->
            <div id="requestsTab" class="tab-content hidden">
                <div class="space-y-4">
                    <h2 class="text-2xl font-bold mb-6">Book Requests</h2>
                    <div id="requestsList" class="space-y-4"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module" src="data.js"></script>
<script type="module">
   const ADMIN_PASSWORD = "admin123";
    let books = [];
    let requests = [];
    let selectedImageBase64 = '';
    let editingBookId = null;

    window.addEventListener('DOMContentLoaded', async function() {
        books = await loadBooks();
        requests = await loadRequests();
    });

    function loginAdmin() {
        const password = document.getElementById('adminPassword').value;
        if (password === ADMIN_PASSWORD) {
            document.getElementById('adminLoginPage').classList.remove('active');
            document.getElementById('adminDashboard').classList.add('active');
            renderManageBooks();
            renderRequests();
        } else {
            alert('Wrong password!');
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('[id^="tab"]').forEach(el => {
            el.classList.remove('border-blue-600', 'text-blue-600');
            el.classList.add('border-transparent', 'text-gray-600');
        });

        if (tab === 'addBook') {
            document.getElementById('addBookTab').classList.remove('hidden');
            document.getElementById('tabAddBook').classList.add('border-blue-600', 'text-blue-600');
            document.getElementById('tabAddBook').classList.remove('border-transparent', 'text-gray-600');
        } else if (tab === 'manageBooks') {
            document.getElementById('manageBooksTab').classList.remove('hidden');
            document.getElementById('tabManageBooks').classList.add('border-blue-600', 'text-blue-600');
            document.getElementById('tabManageBooks').classList.remove('border-transparent', 'text-gray-600');
            renderManageBooks();
        } else if (tab === 'requests') {
            document.getElementById('requestsTab').classList.remove('hidden');
            document.getElementById('tabRequests').classList.add('border-blue-600', 'text-blue-600');
            document.getElementById('tabRequests').classList.remove('border-transparent', 'text-gray-600');
            renderRequests();
        }
    }

    document.getElementById('imageFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('saveBookBtn').disabled = true;
        document.getElementById('saveBookBtn').textContent = 'Processing image...';

        const reader = new FileReader();
        reader.onerror = function() {
            alert("FileReader failed to read the file");
            document.getElementById('saveBookBtn').disabled = false;
            document.getElementById('saveBookBtn').textContent = 'Save Book';
        };
        reader.onload = function(event) {
            const img = new Image();
            img.onerror = function() {
                alert("Image failed to load into canvas");
                document.getElementById('saveBookBtn').disabled = false;
                document.getElementById('saveBookBtn').textContent = 'Save Book';
            };
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxWidth = 600;
                const scale = Math.min(1, maxWidth / img.width);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);

                const preview = document.getElementById('imagePreview');
                preview.src = selectedImageBase64;
                preview.classList.remove('hidden');

                document.getElementById('saveBookBtn').disabled = false;
                document.getElementById('saveBookBtn').textContent = 'Save Book';
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    async function addBook() { const bookData = {
            title_en: document.getElementById('titleEN').value,
            title_ar: document.getElementById('titleAR').value,
            title_ku: document.getElementById('titleKU').value,
            author_en: document.getElementById('authorEN').value,
            author_ar: document.getElementById('authorAR').value,
            author_ku: document.getElementById('authorKU').value,
            desc_en: document.getElementById('descEN').value,
            desc_ar: document.getElementById('descAR').value,
            desc_ku: document.getElementById('descKU').value,
            image_url: selectedImageBase64,
            category: document.getElementById('bookCategory').value,
badge: document.getElementById('bookBadge').value,
price: parseFloat(document.getElementById('bookPrice').value) || 0,
genre: document.getElementById('bookGenre').value === 'other' ? document.getElementById('customGenreEN').value : document.getElementById('bookGenre').value,
genre_ar: document.getElementById('bookGenre').value === 'other' ? document.getElementById('customGenreAR').value : '',
genre_ku: document.getElementById('bookGenre').value === 'other' ? document.getElementById('customGenreKU').value : ''
    };

        if (!bookData.title_en || !bookData.author_en) {
            alert('Please fill in English title and author');
            return;
        }

        if (!bookData.image_url) {
            alert('Please choose an image');
            return;
        }

        if (editingBookId) {
            await updateBookInDb(editingBookId, bookData);
            alert('Book updated successfully!');
            editingBookId = null;
        } else {
            await addBookToDb(bookData);
            alert('Book added successfully!');
        }

        books = await loadBooks();
        clearForm();
        renderManageBooks();
    }

    function clearForm() {
        document.getElementById('titleEN').value = '';
        document.getElementById('titleAR').value = '';
        document.getElementById('titleKU').value = '';
        document.getElementById('authorEN').value = '';
        document.getElementById('authorAR').value = '';
        document.getElementById('authorKU').value = '';
        document.getElementById('descEN').value = '';
        document.getElementById('descAR').value = '';
        document.getElementById('descKU').value = '';
        document.getElementById('imageFile').value = '';
        document.getElementById('imagePreview').classList.add('hidden');
        document.getElementById('bookPrice').value = '';
        document.getElementById('customGenreEN').value = '';
        document.getElementById('customGenreAR').value = '';
        document.getElementById('customGenreKU').value = '';
        selectedImageBase64 = '';
        editingBookId = null;
    }
    function toggleCustomGenre() {
    const genreSelect = document.getElementById('bookGenre');
    const customFields = document.getElementById('customGenreFields');
    if (genreSelect.value === 'other') {
        customFields.classList.remove('hidden');
    } else {
        customFields.classList.add('hidden');
    }
}
    function editBook(firestoreId) {
        const book = books.find(b => b.firestoreId === firestoreId);
        if (!book) return;

        editingBookId = firestoreId;

        document.getElementById('titleEN').value = book.title_en;
        document.getElementById('titleAR').value = book.title_ar;
        document.getElementById('titleKU').value = book.title_ku;
        document.getElementById('authorEN').value = book.author_en;
        document.getElementById('authorAR').value = book.author_ar;
        document.getElementById('authorKU').value = book.author_ku;
        document.getElementById('descEN').value = book.desc_en;
        document.getElementById('descAR').value = book.desc_ar;
        document.getElementById('descKU').value = book.desc_ku;
        document.getElementById('bookCategory').value = book.category || 'kurdish';
        document.getElementById('bookBadge').value = book.badge || 'none';
        document.getElementById('bookPrice').value = book.price || '';
        const knownGenres = ['Medical', 'History', 'Religion', 'Novels/Fiction', "Children's Books", 'Self-Help'];
if (book.genre && knownGenres.includes(book.genre)) {
    document.getElementById('bookGenre').value = book.genre;
    document.getElementById('customGenreFields').classList.add('hidden');
} else if (book.genre) {
    document.getElementById('bookGenre').value = 'other';
    document.getElementById('customGenreEN').value = book.genre;
    document.getElementById('customGenreAR').value = book.genre_ar || '';
    document.getElementById('customGenreKU').value = book.genre_ku || '';
    document.getElementById('customGenreFields').classList.remove('hidden');
} else {
    document.getElementById('bookGenre').value = 'Medical';
    document.getElementById('customGenreFields').classList.add('hidden');
}
        selectedImageBase64 = book.image_url;
        const preview = document.getElementById('imagePreview');
        preview.src = book.image_url;
        preview.classList.remove('hidden');

        switchTab('addBook');
    }

    async function deleteBook(firestoreId) {
        if (confirm('Are you sure?')) {
            await deleteBookFromDb(firestoreId);
            books = await loadBooks();
            alert('Book deleted successfully!');
            renderManageBooks();
        }
    }

    function renderManageBooks() {
        const list = document.getElementById('booksList');
        list.innerHTML = '';

        books.forEach(book => {
            const item = document.createElement('div');
            item.className = 'bg-white rounded-lg shadow p-4';
            item.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <h3 class="font-bold text-lg">${book.title_en}</h3>
                        <p class="text-gray-600">Author: ${book.author_en}</p>
                        <div class="mt-2 grid grid-cols-3 gap-4 text-sm">
                            <div>
                                <p class="font-semibold">Arabic:</p>
                                <p class="text-gray-600">${book.title_ar}</p>
                            </div>
                            <div>
                                <p class="font-semibold">Kurdish:</p>
                                <p class="text-gray-600">${book.title_ku}</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editBook('${book.firestoreId}')" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded font-medium">Edit</button>
                        <button onclick="deleteBook('${book.firestoreId}')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-medium">Delete</button>
                    </div>
                </div>
            `;
            list.appendChild(item);
        });
    }

    async function deleteRequest(firestoreId) {
        if (confirm('Are you sure?')) {
            await deleteRequestFromDb(firestoreId);
            requests = await loadRequests();
            alert('Request deleted successfully!');
            renderRequests();
        }
    }

    function renderRequests() {
        const list = document.getElementById('requestsList');
        list.innerHTML = '';

        if (requests.length === 0) {
            list.innerHTML = '<p class="text-gray-600">No requests yet</p>';
            return;
        }

        requests.forEach(request => {
            const item = document.createElement('div');
            item.className = 'bg-white rounded-lg shadow p-4';
            item.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <h3 class="font-bold text-lg">${request.requester_name}</h3>
                        <p class="text-gray-600">Book: ${request.book_title}</p>
                        <p class="text-gray-600">Address: ${request.requester_address}</p>
                        <p class="text-sm text-gray-500">Date: ${request.date}</p>
                    </div>
                    <button onclick="deleteRequest('${request.firestoreId}')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-medium">Delete</button>
                </div>
            `;
            list.appendChild(item);
        });
    }

    window.loginAdmin = loginAdmin;
    window.switchTab = switchTab;
    window.addBook = addBook;
    window.clearForm = clearForm;
    window.editBook = editBook;
    window.deleteBook = deleteBook;
    window.deleteRequest = deleteRequest; 
    window.toggleCustomGenre = toggleCustomGenre;
</script>

</body>
</html>
